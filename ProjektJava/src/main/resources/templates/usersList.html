<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista użytkowników</title>
</head>
<body>
<h2>Zarejestrowani użytkownicy</h2>

<table border="1" cellpadding="10">
    <thead>
    <tr>
        <th>ID</th>
        <th>Nazwa użytkownika (Ksywka)</th>
        <th>Imię</th>
        <th>Nazwisko</th>
        <th>Email</th>
        <th>Data Urodzenia</th>
        <th>Status</th>
        <th>Punkty</th>
        <th>Data rejestracji</th>
        <th>Usuń</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="u : ${usersList}">
        <td th:text="${u.id}">1</td>
        <td th:text="${u.nickname}" style="font-weight: bold;">Ksywka</td>
        <td th:text="${u.firstName}">Imię</td>
        <td th:text="${u.lastName}">Nazwisko</td>
        <td th:text="${u.email}">Email</td>
        <td th:text="${u.birthDate}">Data urodzenia</td>
        <td th:text="${u.statusUser}">Status</td>
        <td th:text="${u.points}">PRPoints</td>
        <td th:text="${u.enterDate}">Data dołączenia</td>
        <td>
            <a th:href="@{/users/delete/{id}(id=${u.id})}"
               onclick="return confirm('Czy na pewno chcesz usunąć tego użytkownika?')">
                <button type="button">Usuń</button>
            </a>
        </td>
    </tr>
    </tbody>
</table>

<br>
<a href="/users/register">Dodaj nowego użytkownika</a>

</body>
</html>
