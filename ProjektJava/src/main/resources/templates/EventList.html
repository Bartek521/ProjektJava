<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROJEKT 2115 - Zarządzanie Eventami</title>
  <style>
    :root {
      --bg-black: #0b0b0b;
      --card-gray: #161616;
      --accent-gold: #d4af37;
      --text-white: #ffffff;
      --text-muted: #aaaaaa;
      --error-red: #ff4d4d;
      --border-color: #222;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-white);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.5rem;
      letter-spacing: 3px;
      margin: 0;
      text-transform: uppercase;
    }

    header h1 span {
      color: var(--accent-gold);
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 5px;
    }

    main {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    /* Sekcja formularza dodawania */
    section.form-section {
      background-color: var(--card-gray);
      border: 1px solid var(--border-color);
      padding: 30px;
      border-radius: 8px;
    }

    section h3, section h2 {
      margin-top: 0;
      margin-bottom: 25px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-gold);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      align-items: end;
    }

    form p {
      margin: 0;
      display: flex;
      flex-direction: column;
    }

    form p.submit-box {
      grid-column: 1 / -1;
      margin-top: 10px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 8px;
      color: var(--text-white);
      letter-spacing: 0.5px;
    }

    input, select {
      padding: 12px;
      background-color: #222;
      border: 1px solid #333;
      border-radius: 6px;
      color: var(--text-white);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus, select:focus {
      border-color: var(--accent-gold);
    }

    button {
      padding: 12px 24px;
      background-color: var(--accent-gold);
      color: #000;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    /* Stylizacja przycisków wewnątrz tabeli */
    button.btn-table {
      padding: 6px 14px;
      font-size: 0.8rem;
      border-radius: 4px;
    }

    button.btn-edit {
      background-color: transparent;
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
    }

    button.btn-edit:hover {
      background-color: var(--accent-gold);
      color: #000;
    }

    button.btn-delete {
      background-color: transparent;
      color: var(--error-red);
      border: 1px solid var(--error-red);
    }

    button.btn-delete:hover {
      background-color: var(--error-red);
      color: #000;
    }

    /* Linki w tabeli nie resetują wyglądu przycisków */
    table a {
      text-decoration: none;
    }

    /* Nowoczesna tabela menedżerska */
    section.table-section {
      background-color: var(--card-gray);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background-color: #1c1c1c;
      color: var(--accent-gold);
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 1px;
      padding: 15px;
      border-bottom: 2px solid var(--border-color);
    }

    td {
      padding: 15px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.95rem;
      color: #e0e0e0;
    }

    tr:hover td {
      background-color: #1a1a1a;
    }

    footer {
      margin-top: 30px;
      text-align: center;
    }

    footer a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      border-bottom: 1px dashed var(--text-muted);
      padding-bottom: 2px;
    }

    footer a:hover {
      color: var(--accent-gold);
      border-color: var(--accent-gold);
    }
  </style>
</head>
<body>

<header>
  <h1>Panel <span>Eventów</span></h1>
  <p>Modyfikacja harmonogramu koncertów i biletów</p>
</header>

<main>
  <section class="form-section">
    <h3>Dodaj event</h3>
    <form th:action="@{/events/add}" th:object="${newEvent}" method="post">
      <p>
        <label>Nazwa eventu:</label>
        <input type="text" th:field="*{name}" required placeholder="np. Hip-Hop Festival" />
        <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color: var(--error-red); font-size: 0.85rem; margin-top: 4px;"></span>
      </p>

      <p>
        <label>Artysta:</label>
        <select name="artist" required>
          <option value="">-- Wybierz artystę z bazy --</option>
          <option th:each="art : ${artists}"
                  th:value="${art.id_artist}"
                  th:text="${art.user.nickname}"></option>
        </select>
      </p>

      <p>
        <label>Lokalizacja:</label>
        <input type="text" th:field="*{location}" required placeholder="np. Arena Warszawa" />
        <span th:if="${#fields.hasErrors('location')}" th:errors="*{location}" style="color: var(--error-red); font-size: 0.85rem; margin-top: 4px;"></span>
      </p>

      <p>
        <label>Cena biletu (PLN):</label>
        <input type="number" step="0.01" th:field="*{ticketPrice}" required placeholder="0.00" />
        <span th:if="${#fields.hasErrors('ticketPrice')}" th:errors="*{ticketPrice}" style="color: var(--error-red); font-size: 0.85rem; margin-top: 4px;"></span>
      </p>

      <p>
        <label>Data rozpoczęcia:</label>
        <input type="datetime-local" th:field="*{eventDate}" required />
        <span th:if="${#fields.hasErrors('eventDate')}" th:errors="*{eventDate}" style="color: var(--error-red); font-size: 0.85rem; margin-top: 4px;"></span>
      </p>

      <p>
        <label>Data zakończenia:</label>
        <input type="datetime-local" th:field="*{endDate}" required />
        <span th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}" style="color: var(--error-red); font-size: 0.85rem; margin-top: 4px;"></span>
      </p>

      <p>
        <label>Liczba wolnych miejsc:</label>
        <input type="number" th:field="*{availableSeats}" required min="0" placeholder="500" />
        <span th:if="${#fields.hasErrors('availableSeats')}" th:errors="*{availableSeats}" style="color: var(--error-red); font-size: 0.85rem; margin-top: 4px;"></span>
      </p>

      <p class="submit-box">
        <button type="submit">Zapisz event w bazie</button>
      </p>
    </form>
  </section>

  <section class="table-section">
    <h2>Zaplanowane Wydarzenia</h2>
    <table>
      <thead>
      <tr>
        <th>Nazwa eventu</th>
        <th>Artysta</th>
        <th>Lokalizacja</th>
        <th>Cena biletu</th>
        <th>Rozpoczęcie</th>
        <th>Zakończenie</th>
        <th>Wolne miejsca</th>
        <th>Edytuj</th>
        <th>Usuń</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="event : ${events}">
        <td th:text="${event.name}">Nazwa</td>
        <td th:text="${event.artist != null && event.artist.user != null ? event.artist.user.nickname : 'Brak artysty'}">Ksywka</td>
        <td th:text="${event.location}">Lokalizacja</td>
        <td th:text="${event.ticketPrice} + ' PLN'">0.00</td>
        <td th:text="${event.eventDate != null ? #temporals.format(event.eventDate, 'dd-MM-yyyy HH:mm') : 'Brak'}"></td>
        <td th:text="${event.endDate != null ? #temporals.format(event.endDate, 'dd-MM-yyyy HH:mm') : 'Brak'}"></td>
        <td th:text="${event.availableSeats}">100</td>
        <td>
          <a th:href="@{/events/edit/{id}(id=${event.id})}">
            <button type="button" class="btn-table btn-edit">Edytuj</button>
          </a>
        </td>
        <td>
          <a th:href="@{/events/delete/{id}(id=${event.id})}" onclick="return confirm('Czy na pewno chcesz usunąć ten koncert?')">
            <button type="button" class="btn-table btn-delete">Usuń</button>
          </a>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(events)}">
        <td colspan="9" style="text-align: center; color: var(--text-muted); padding: 25px;">
          Brak eventów w bazie danych Oracle.
        </td>
      </tr>
      </tbody>
    </table>
  </section>
</main>

<footer>
  <a href="/">← Wróć do Panelu Dowodzenia</a>
</footer>

</body>
</html>
