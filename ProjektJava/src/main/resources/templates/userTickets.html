<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROJEKT 2115 - Twoje Bilety</title>
  <style>
    :root {
      --bg-black: #0b0b0b;
      --card-gray: #161616;
      --accent-gold: #d4af37;
      --text-white: #ffffff;
      --text-muted: #aaaaaa;
      --border-color: #222;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-white);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.5rem;
      letter-spacing: 3px;
      margin: 0;
      text-transform: uppercase;
    }

    header h1 span {
      color: var(--accent-gold);
    }

    header h3 {
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 400;
      margin-top: 10px;
      letter-spacing: 0.5px;
    }

    header h3 strong {
      color: var(--text-white);
    }

    main {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    /* Kontener dla nowoczesnej tabeli */
    section.table-section {
      background-color: var(--card-gray);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background-color: #1c1c1c;
      color: var(--accent-gold);
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 1px;
      padding: 18px 15px;
      border-bottom: 2px solid var(--border-color);
    }

    td {
      padding: 18px 15px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.95rem;
      color: #e0e0e0;
    }

    tr:hover td {
      background-color: #1a1a1a;
    }

    /* Badge dla typu biletu (np. VIP / VIP_PLATINUM) */
    td th\:text {
      font-weight: bold;
    }

    /* Dolna sekcja nawigacji z przyciskami */
    section.actions-section {
      display: flex;
      gap: 15px;
      justify-content: flex-start;
      margin-top: 10px;
    }

    section.actions-section a {
      text-decoration: none;
    }

    button {
      padding: 14px 28px;
      background-color: var(--accent-gold);
      color: #000;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    /* Przyciski drugorzędne (neutralne) */
    button.btn-secondary {
      background-color: transparent;
      color: var(--text-muted);
      border: 1px solid #333;
    }

    button.btn-secondary:hover {
      background-color: #222;
      color: var(--text-white);
      border-color: var(--text-white);
    }

    footer {
      margin-top: 40px;
      text-align: center;
    }

    footer a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      border-bottom: 1px dashed var(--text-muted);
      padding-bottom: 2px;
    }

    footer a:hover {
      color: var(--accent-gold);
      border-color: var(--accent-gold);
    }
  </style>
</head>
<body>

<header>
  <h1>Twoje <span>Bilety</span></h1>
  <h3 th:if="${user != null}">
    Konto: <strong th:text="${user.firstName} + ' ' + ${user.lastName}">Imię Nazwisko</strong>
    (<span th:text="${user.email}">email@gangu.pl</span>)
  </h3>
</header>

<main>
  <section class="table-section">
    <table>
      <thead>
      <tr>
        <th>ID Biletu</th>
        <th>Nazwa koncertu</th>
        <th>Lokalizacja</th>
        <th>Data rozpoczęcia</th>
        <th>Typ biletu</th>
        <th>Cena zapłacona</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="t : ${tickets}">
        <td th:text="${t.id}" style="font-family: monospace; color: var(--accent-gold);">ID</td>
        <td th:text="${t.event != null ? t.event.name : 'Brak danych'}">Nazwa koncertu</td>
        <td th:text="${t.event != null ? t.event.location : 'Brak danych'}">Lokalizacja</td>
        <td th:text="${t.event != null && t.event.eventDate != null ? #temporals.format(t.event.eventDate, 'dd-MM-yyyy HH:mm') : '-'}">Data</td>
        <td th:text="${t.ticketType}" style="font-weight: 600; letter-spacing: 0.5px;">BASIC</td>
        <td th:text="${t.price} + ' PLN'" style="font-weight: 600;">0.00 PLN</td>
      </tr>

      <tr th:if="${#lists.isEmpty(tickets)}">
        <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 30px;">
          Nie posiadasz jeszcze żadnych zakupionych biletów na nadchodzące koncerty.
        </td>
      </tr>
      </tbody>
    </table>
  </section>

  <section class="actions-section">
    <a th:href="@{/tickets/book}">
      <button type="button">Kup kolejny bilet</button>
    </a>
    <a th:href="@{/events}">
      <button type="button" class="btn-secondary">Lista wszystkich eventów</button>
    </a>
  </section>
</main>

<footer>
  <a href="/">← Wróć do Panelu Dowodzenia</a>
</footer>

</body>
</html>
