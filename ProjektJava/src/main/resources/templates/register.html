<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJEKT 2115 - Dołącz do Gangu</title>
    <style>
        :root {
            --bg-black: #0b0b0b;
            --card-gray: #161616;
            --accent-gold: #d4af37;
            --text-white: #ffffff;
            --text-muted: #aaaaaa;
            --error-red: #ff4d4d;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h2 {
            font-size: 2.5rem;
            letter-spacing: 3px;
            margin: 0;
            text-transform: uppercase;
        }

        header h2 span {
            color: var(--accent-gold);
        }

        p.error-msg {
            color: var(--error-red);
            background-color: rgba(255, 77, 77, 0.1);
            border: 1px solid var(--error-red);
            padding: 15px;
            border-radius: 6px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-sizing: border-box;
        }

        form {
            background-color: var(--card-gray);
            border: 1px solid #222;
            padding: 40px;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: var(--text-white);
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: #222;
            border: 1px solid #333;
            border-radius: 6px;
            color: var(--text-white);
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 5px;
            transition: border-color 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        span.field-error {
            display: block;
            color: var(--error-red);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: var(--accent-gold);
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        footer {
            margin-top: 30px;
            text-align: center;
        }

        footer a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s ease;
            border-bottom: 1px dashed var(--text-muted);
            padding-bottom: 2px;
        }

        footer a:hover {
            color: var(--accent-gold);
            border-color: var(--accent-gold);
        }
    </style>
</head>
<body>

<header>
    <h2>Dołącz do <span>Gangu</span></h2>
</header>

<p class="error-msg" th:if="${error}" th:text="${error}"></p>

<form th:action="@{/users/register}" th:object="${user}" method="post">

    <label>Nazwa użytkownika (Ksywka):</label>
    <input type="text" th:field="*{nickname}" placeholder="np. White2115" required />
    <span class="field-error" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></span>

    <label>Imię:</label>
    <input type="text" th:field="*{firstName}" placeholder="Twoje imię" required />
    <span class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>

    <label>Nazwisko:</label>
    <input type="text" th:field="*{lastName}" placeholder="Twoje nazwisko" required />
    <span class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>

    <label>Data urodzenia:</label>
    <input type="date" th:field="*{birthDate}" required />
    <span class="field-error" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></span>

    <label>Email:</label>
    <input type="email" th:field="*{email}" placeholder="gang@2115.pl" required />
    <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

    <label>Hasło:</label>
    <input type="password" th:field="*{password}" placeholder="••••••••" required />
    <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>

    <button type="submit">Zarejestruj się</button>
</form>

<footer>
    <a href="/">← Wróć do Panelu Dowodzenia</a>
</footer>

</body>
</html>
