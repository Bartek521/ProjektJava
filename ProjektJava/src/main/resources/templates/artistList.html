<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJEKT 2115 - Zarządzanie Artystami</title>
    <style>
        :root {
            --bg-black: #0b0b0b;
            --card-gray: #161616;
            --accent-gold: #d4af37;
            --text-white: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #222;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            letter-spacing: 3px;
            margin: 0;
            text-transform: uppercase;
        }

        header h1 span {
            color: var(--accent-gold);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 5px;
        }

        main {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        /* Sekcja formularza nadawania roli */
        section.form-section {
            background-color: var(--card-gray);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 8px;
        }

        section h3, section h2 {
            margin-top: 0;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-gold);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        section h2 {
            margin-bottom: 20px;
        }

        form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            align-items: end;
        }

        form p {
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        form p.actions-box {
            grid-column: 1 / -1;
            flex-direction: row;
            gap: 15px;
            margin-top: 10px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: var(--text-white);
            letter-spacing: 0.5px;
        }

        input, select {
            padding: 12px;
            background-color: #222;
            border: 1px solid #333;
            border-radius: 6px;
            color: var(--text-white);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--accent-gold);
        }

        button {
            padding: 12px 24px;
            background-color: var(--accent-gold);
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Styl dla przycisku neutralnego / powrotu */
        button.btn-secondary {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid #333;
        }

        button.btn-secondary:hover {
            background-color: #222;
            color: var(--text-white);
            border-color: var(--text-white);
        }

        /* Usunięcie domyślnego stylowania linku wokół przycisku */
        form p.actions-box a {
            text-decoration: none;
        }

        /* Nowoczesna tabela bez atrybutów dekoracyjnych */
        section.table-section {
            background-color: var(--card-gray);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #1c1c1c;
            color: var(--accent-gold);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            padding: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
            color: #e0e0e0;
        }

        tr:hover td {
            background-color: #1a1a1a;
        }

        footer {
            margin-top: 30px;
            text-align: center;
        }

        footer a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            border-bottom: 1px dashed var(--text-muted);
            padding-bottom: 2px;
        }

        footer a:hover {
            color: var(--accent-gold);
            border-color: var(--accent-gold);
        }
    </style>
</head>
<body>

<header>
    <h1>Panel <span>Artystów</span></h1>
    <p>Rozszerzenie bazy danych kont użytkowników</p>
</header>

<main>
    <section class="form-section">
        <h3>Nadaj profil artysty istniejącemu użytkownikowi</h3>
        <form th:action="@{/artists/add}" method="post">
            <p>
                <label>Wybierz użytkownika z bazy:</label>
                <select name="id_artist" required>
                    <option value="">-- Wybierz konto użytkownika --</option>
                    <option th:each="u : ${users}"
                            th:value="${u.id}"
                            th:text="${u.firstName} + ' ' + ${u.lastName} + ' (' + ${u.email} + ')'"></option>
                </select>
            </p>

            <p>
                <label>Nazwa zespołu / grupy:</label>
                <input type="text" name="groupName" required placeholder="np. GANG 2115" />
            </p>

            <p class="actions-box">
                <button type="submit">Zapisz profil artysty</button>
                <a th:href="@{/events}">
                    <button type="button" class="btn-secondary">Przejdź do Eventów</button>
                </a>
            </p>
        </form>
    </section>

    <section class="table-section">
        <h2>Aktywne profile artystów w bazie</h2>
        <table>
            <thead>
            <tr>
                <th>ID Artysty</th>
                <th>Nazwa zespołu / grupy</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="art : ${artists}">
                <td th:text="${art.id_artist}">1</td>
                <td th:text="${art.groupName}">Nazwa Zespołu</td>
            </tr>
            <tr th:if="${#lists.isEmpty(artists)}">
                <td colspan="2" style="text-align: center; color: var(--text-muted); padding: 25px;">
                    Brak przypisanych profilów artystów. Wybierz użytkownika powyżej!
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>

<footer>
    <a href="/">← Wróć do Panelu Dowodzenia</a>
</footer>

</body>
</html>
